name: Build NEXUS and package ZIP

on:
  push:
    branches:
      - feature/jarvis-inventory-assistant
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore solution
        run: dotnet restore "nexus v1.0.slnx"
      - name: Build solution
        run: dotnet build "nexus v1.0.slnx" --configuration Release --no-restore
      - name: Package source project
        if: success()
        shell: pwsh
        run: |
          $exclude = @('.git', '.vs', 'bin', 'obj')
          $items = Get-ChildItem -Force | Where-Object { $exclude -notcontains $_.Name }
          Compress-Archive -Path $items.FullName -DestinationPath "$env:RUNNER_TEMP/NEXUS-v1.0-JARVIS.zip" -Force
      - name: Upload ZIP artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-v1.0-JARVIS
          path: ${{ runner.temp }}/NEXUS-v1.0-JARVIS.zip
          if-no-files-found: error
          retention-days: 14
